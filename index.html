<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON BREAKER</title>
<style>
:root{color-scheme:dark;--cyan:#35eaff;--pink:#ff39d4;--bg:#050510}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#effcff}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,160vh);height:min(100vh,62.5vw);min-height:320px;background:#050510;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:clamp(10px,2vw,22px) clamp(14px,3vw,34px);pointer-events:none;text-shadow:0 0 12px #2deaff}
.brand{font-size:clamp(13px,2vw,22px);font-weight:900;letter-spacing:.22em;color:#a8f8ff}
.stats{display:flex;gap:clamp(12px,3vw,34px);font-size:clamp(11px,1.6vw,17px);font-weight:800;letter-spacing:.1em}
.stats span{color:#fff}
.stats b{color:#4cf3ff;margin-left:5px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(14,13,45,.72),rgba(2,2,12,.9));text-align:center;padding:20px}
.panel{max-width:520px;padding:clamp(22px,4vw,42px);border:1px solid rgba(70,235,255,.45);border-radius:18px;background:rgba(6,10,30,.84);box-shadow:0 0 35px #0bd4ff33,inset 0 0 25px #a22cff18}
h1{margin:0 0 8px;font-size:clamp(34px,7vw,68px);letter-spacing:.12em;line-height:1;color:#fff;text-shadow:0 0 8px #fff,0 0 22px #08dfff,0 0 42px #a42cff}
#subtitle{color:#9befff;letter-spacing:.2em;font-size:12px;margin-bottom:22px}
p{color:#c4d9ed;line-height:1.6;font-size:14px}
button{border:0;border-radius:999px;padding:13px 30px;margin-top:10px;color:#04101a;background:linear-gradient(90deg,#40f4ff,#f24bdb);font-weight:900;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 22px #28eaff88}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}
.sound{position:absolute;right:clamp(12px,2vw,24px);top:clamp(48px,6vw,70px);padding:7px 12px;margin:0;font-size:10px;letter-spacing:.1em;pointer-events:auto;background:rgba(24,40,70,.85);color:#aaf8ff;border:1px solid #36eaff66;box-shadow:0 0 12px #28eaff33}
.small{font-size:11px;color:#8298b7;margin-top:14px}
.hidden{display:none!important}
@media(max-width:600px){.brand{letter-spacing:.1em}.stats{gap:7px;font-size:9px;padding-top:24px}.sound{top:10px;right:10px}.panel{padding:22px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" aria-label="Neon Breaker"></canvas>
<div class="hud">
  <div class="brand">NEON / BREAKER</div>
  <div class="stats"><div>PUNTS <b id="score">0</b></div><div>RÈCORD <b id="best">0</b></div><div>VIDES <b id="lives">3</b></div><div>NIVELL <b id="level">1</b></div></div>
  <button id="sound" class="sound" aria-label="Activar o desactivar so">♫ SO: ON</button>
</div>
<div id="overlay">
  <div class="panel">
    <h1 id="title">NEON<br>BREAKER</h1>
    <div id="subtitle">ARCADE // BRICK DESTROYER</div>
    <p id="message">Destrueix tots els maons, recull els power-ups i intenta no deixar caure la pilota.</p>
    <button id="start">JUGAR</button>
    <div class="small">RATOLÍ / ← → PER MOURE · ESPAI PER PAUSAR · TÀCTIL COMPATIBLE</div>
  </div>
</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('wrap'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level'),bestEl=document.getElementById('best'),soundBtn=document.getElementById('sound');
let best=Number(localStorage.getItem('neonBreakerBest')||0),soundOn=true,audioCtx=null;
const startBtn=document.getElementById('start'),titleEl=document.getElementById('title'),messageEl=document.getElementById('message');
let W=960,H=600,dpr=1,scale=1,last=0,raf=0,state='ready',score=0,lives=3,level=1,keys={};
let paddle,balls=[],bricks=[],particles=[],drops=[],lasers=[],stars=[];
const COLORS=['#21dfff','#21f5c5','#8cff39','#e8f43c','#ffad35','#ff4c9c','#bd5cff'];
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
 const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 W=960;H=600;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
 canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
 scale=canvas.width/W;ctx.setTransform(scale,0,0,scale,0,0);
}
new ResizeObserver(resize).observe(wrap);resize();
function makeStars(){stars=Array.from({length:100},()=>({x:rand(0,W),y:rand(0,H),a:rand(.15,.65),s:rand(.4,1.6)}))}
function newPaddle(){return {x:W/2-58,y:H-55,w:116,h:13,base:116,target:W/2,speed:8,wide:0}}
function makeBall(x,y,vx,vy){return {x,y,r:8,vx,vy,trail:[]}}
function resetBall(){balls=[makeBall(paddle.x+paddle.w/2,paddle.y-13,rand(-2.5,2.5),-5.2- level*.25)]}
function buildBricks(){
 bricks=[];const cols=11,rows=4,gap=8,left=43,top=88,bw=(W-left*2-gap*(cols-1))/cols,bh=25;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const color=COLORS[Math.min(COLORS.length-1,Math.floor(c/2)+Math.floor(r/2))];
  bricks.push({x:left+c*(bw+gap),y:top+r*(bh+10),w:bw,h:bh,color,hp:1,alive:true});
 }
}
function startGame(){score=0;lives=3;level=1;paddle=newPaddle();particles=[];drops=[];lasers=[];buildBricks();resetBall();syncHud();state='playing';overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);beep(520,.12,'triangle');raf=requestAnimationFrame(loop)}
function syncHud(){
 scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level;bestEl.textContent=best;
 if(score>best){best=score;localStorage.setItem('neonBreakerBest',String(best));bestEl.textContent=best}
}
function beep(freq=440,duration=.07,type='sine',volume=.035){
 if(!soundOn)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
 gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)
 }catch(e){}
}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♫ SO: ON':'♫ SO: OFF';if(soundOn)beep(660,.09,'triangle')});

function showOverlay(title,msg,button='TORNAR A JUGAR'){titleEl.innerHTML=title;messageEl.textContent=msg;startBtn.textContent=button;overlay.classList.remove('hidden')}
function pause(){if(state==='playing'){state='paused';showOverlay('PAUSA', 'Prem el botó per continuar la partida.','CONTINUAR')}else if(state==='paused'){state='playing';overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}}
function addParticles(x,y,color,n=18){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(1,5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(22,42),max:42,size:rand(1.5,4),color})}}
function spawnDrop(b){if(Math.random()<.17){const types=['wide','multi','laser'];drops.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:2.1,type:types[Math.floor(Math.random()*types.length)],color:{wide:'#55ffb0',multi:'#64d9ff',laser:'#ff55d9'}[types[Math.floor(Math.random()*types.length)] ]||'#fff'});const d=drops[drops.length-1];d.color=d.type==='wide'?'#55ffb0':d.type==='multi'?'#64d9ff':'#ff55d9'}}
function destroyBrick(b){if(!b.alive)return;b.alive=false;score+=10;beep(250+Math.random()*420,.055,'square',.018);addParticles(b.x+b.w/2,b.y+b.h/2,b.color,24);if(Math.random()<.17){const types=['wide','multi','laser'];const type=types[Math.floor(Math.random()*types.length)];drops.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:2.2,type,color:type==='wide'?'#55ffb0':type==='multi'?'#64d9ff':'#ff55d9'})}syncHud()}
function applyPower(type){
 if(type==='wide'){paddle.w=Math.min(190,paddle.w+48);paddle.wide=900}
 if(type==='multi'&&balls.length<8){const original=balls.slice();original.forEach(b=>{if(balls.length<8){balls.push(makeBall(b.x,b.y,-b.vx+rand(-1,1),b.vy))}})}
 if(type==='laser'){paddle.laser=600}
}
function circleRect(ball,r){const cx=Math.max(r.x,Math.min(ball.x,r.x+r.w)),cy=Math.max(r.y,Math.min(ball.y,r.y+r.h));const dx=ball.x-cx,dy=ball.y-cy;return dx*dx+dy*dy<ball.r*ball.r}
function collideBrick(ball,b){
 const px=ball.x-ball.vx,py=ball.y-ball.vy;
 const fromLeft=px+ball.r<=b.x,fromRight=px-ball.r>=b.x+b.w,fromTop=py+ball.r<=b.y,fromBottom=py-ball.r>=b.y+b.h;
 if(fromLeft||fromRight)ball.vx*=-1;else if(fromTop||fromBottom)ball.vy*=-1;else{
  const dx=(ball.x-(b.x+b.w/2))/(b.w/2),dy=(ball.y-(b.y+b.h/2))/(b.h/2);
  if(Math.abs(dx)>Math.abs(dy))ball.vx*=-1;else ball.vy*=-1;
 }
 destroyBrick(b);
}
function update(dt){
 const f=Math.min(dt/16.67,2.2);
 // Paddle follows pointer or keyboard
 if(keys.ArrowLeft||keys.a)paddle.target-=paddle.speed*f*5;
 if(keys.ArrowRight||keys.d)paddle.target+=paddle.speed*f*5;
 paddle.x+=(paddle.target-paddle.w/2-paddle.x)*Math.min(1,.38*f);
 paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x));
 if(paddle.wide>0){paddle.wide-=f;if(paddle.wide<=0)paddle.w=paddle.base}
 if(paddle.laser>0){paddle.laser-=f;if(Math.floor(paddle.laser/22)!==Math.floor((paddle.laser+f)/22)){lasers.push({x:paddle.x+14,y:paddle.y-8,vy:-9},{x:paddle.x+paddle.w-14,y:paddle.y-8,vy:-9})}}
 balls.forEach((b,idx)=>{
  b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
  b.x+=b.vx*f;b.y+=b.vy*f;
  if(b.x-b.r<12){b.x=12+b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W-12){b.x=W-12-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y-b.r<15){b.y=15+b.r;b.vy=Math.abs(b.vy)}
  if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x-2&&b.x<=paddle.x+paddle.w+2){
   const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);const speed=Math.hypot(b.vx,b.vy);
   const angle=hit*1.12;b.vx=Math.sin(angle)*speed;b.vy=-Math.cos(angle)*speed;b.y=paddle.y-b.r-1;
   addParticles(b.x,paddle.y,'#ff55dc',5);beep(390,.06,'triangle',.022);
  }
  for(const brick of bricks){if(brick.alive&&circleRect(b,brick)){collideBrick(b,brick);break}}
 });
 balls=balls.filter(b=>b.y-b.r<H+10);
 if(!balls.length){lives--;syncHud();beep(130,.28,'sawtooth',.035);if(lives<=0){state='over';showOverlay('GAME OVER',`Puntuació final: ${score} · Rècord: ${best}. Torna-ho a provar!`,'REINTENTAR');return}else{resetBall();state='serve';serveAt=performance.now();showOverlay('UNA VIDA MENYS',`Et queden ${lives} vides. Prem CONTINUAR per reprendre la partida.`,'CONTINUAR')}}
 drops.forEach(d=>{d.y+=d.vy*f;if(d.y>paddle.y&&d.y<paddle.y+paddle.h+10&&d.x>paddle.x&&d.x<paddle.x+paddle.w){applyPower(d.type);d.taken=true;addParticles(d.x,d.y,d.color,16)}});
 drops=drops.filter(d=>!d.taken&&d.y<H+20);
 lasers.forEach(l=>{l.y+=l.vy*f;for(const b of bricks){if(b.alive&&l.x>b.x&&l.x<b.x+b.w&&l.y>b.y&&l.y<b.y+b.h){destroyBrick(b);l.dead=true;break}}});lasers=lasers.filter(l=>!l.dead&&l.y>0);
 particles.forEach(p=>{p.x+=p.vx*f;p.y+=p.vy*f;p.vx*=.98;p.vy=p.vy*.98+.025*f;p.life-=f});particles=particles.filter(p=>p.life>0);
 if(bricks.every(b=>!b.alive)){level++;buildBricks();balls.forEach(b=>{b.vx*=1.08;b.vy*=1.08});syncHud();addParticles(W/2,250,'#fff',60)}
 // Gradual speed ramp, capped
 balls.forEach(b=>{const sp=Math.hypot(b.vx,b.vy),cap=8.8+level*.45;if(sp<cap){const ns=Math.min(cap,sp+.0009*f);b.vx*=ns/sp;b.vy*=ns/sp}});
}
let serveAt=0;
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#08091b');bg.addColorStop(.55,'#050713');bg.addColorStop(1,'#10051c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // subtle starfield and scanlines
 stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#83dfff';ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.globalAlpha=1;
 ctx.save();ctx.strokeStyle='rgba(48,112,180,.12)';ctx.lineWidth=1;for(let y=20;y<H;y+=5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
 // neon arena frame
 ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#e62fd4';ctx.strokeStyle='#e93ed9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,20);ctx.lineTo(14,H-18);ctx.quadraticCurveTo(14,H-8,26,H-8);ctx.lineTo(W-26,H-8);ctx.quadraticCurveTo(W-14,H-8,W-14,H-20);ctx.lineTo(W-14,20);ctx.stroke();ctx.restore();
 bricks.forEach(b=>{if(!b.alive)return;ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=17;const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,'#ffffff55');g.addColorStop(.25,b.color);g.addColorStop(1,b.color+'99');ctx.fillStyle=g;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=b.color;ctx.globalAlpha=.9;ctx.lineWidth=1.4;roundRect(b.x+1,b.y+1,b.w-2,b.h-2,4);ctx.stroke();ctx.fillStyle='#fff';ctx.globalAlpha=.18;roundRect(b.x+4,b.y+3,b.w-8,3,2);ctx.fill();ctx.restore()});
 // paddle
 if(paddle){ctx.save();ctx.shadowColor='#f735d2';ctx.shadowBlur=26;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);pg.addColorStop(0,'#ff38bf');pg.addColorStop(.5,'#9d55ff');pg.addColorStop(1,'#38eaff');ctx.fillStyle=pg;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();ctx.shadowBlur=8;ctx.strokeStyle='#fff';ctx.lineWidth=1;roundRect(paddle.x+2,paddle.y+1,paddle.w-4,paddle.h-2,7);ctx.stroke();ctx.restore();
 if(paddle.laser>0){ctx.save();ctx.shadowColor='#ff4ee8';ctx.shadowBlur=16;ctx.fillStyle='#ff6de8';ctx.fillRect(paddle.x+11,paddle.y-14,5,12);ctx.fillRect(paddle.x+paddle.w-16,paddle.y-14,5,12);ctx.restore()}}
 balls.forEach(b=>{ctx.save();b.trail.forEach((t,i)=>{ctx.globalAlpha=(i/b.trail.length)*.25;ctx.fillStyle='#42eaff';ctx.beginPath();ctx.arc(t.x,t.y,b.r*(i/b.trail.length),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.shadowColor='#28eaff';ctx.shadowBlur=28;const g=ctx.createRadialGradient(b.x-3,b.y-4,1,b.x,b.y,b.r*1.8);g.addColorStop(0,'#fff');g.addColorStop(.3,'#b8ffff');g.addColorStop(1,'#16caff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore()});
 drops.forEach(d=>{ctx.save();ctx.translate(d.x,d.y);ctx.rotate(Math.PI/4);ctx.shadowColor=d.color;ctx.shadowBlur=18;ctx.fillStyle=d.color;ctx.fillRect(-8,-8,16,16);ctx.strokeStyle='#fff';ctx.strokeRect(-8,-8,16,16);ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(d.type==='wide'?'W':d.type==='multi'?'M':'L',d.x,d.y+3)});
 lasers.forEach(l=>{ctx.save();ctx.shadowColor='#ff4ee8';ctx.shadowBlur=14;ctx.fillStyle='#ffb4f3';ctx.fillRect(l.x-2,l.y,4,15);ctx.restore()});
 particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.restore()});
 if(state==='serve'){ctx.fillStyle='#c8faff';ctx.textAlign='center';ctx.font='bold 15px Arial';ctx.shadowColor='#32eaff';ctx.shadowBlur=12;ctx.fillText('PREPARA’T...',W/2,H/2+30);ctx.shadowBlur=0}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(t){if(state!=='playing')return;const dt=Math.min(40,t-last);last=t;update(dt);draw();if(state==='playing')raf=requestAnimationFrame(loop)}
function frame(t){if(state==='serve'){if(t-serveAt>900){state='playing';last=t;raf=requestAnimationFrame(loop)}else{draw();requestAnimationFrame(frame)}}}
function pointer(e){const rect=canvas.getBoundingClientRect();paddle.target=(e.clientX-rect.left)/rect.width*W}
canvas.addEventListener('pointermove',e=>{if(paddle)pointer(e)});
canvas.addEventListener('pointerdown',e=>{if(paddle)pointer(e);if(state==='serve'){state='playing';last=performance.now();raf=requestAnimationFrame(loop)}});
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();pause()}});
window.addEventListener('keyup',e=>keys[e.key]=false);
startBtn.addEventListener('click',()=>{if(state==='paused'){state='playing';overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}else if(state==='serve'){overlay.classList.add('hidden');state='playing';last=performance.now();raf=requestAnimationFrame(loop)}else startGame()});
makeStars();paddle=newPaddle();buildBricks();resetBall();bestEl.textContent=best;draw();
})();
</script>
</body>
</html>

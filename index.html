<!doctype html>
<html lang="ca">
<head>

<title>CYBERPUNK NEON OVERLOAD</title>
<style>
:root{--cyan:#00f3ff;--pink:#ff0055;--purple:#9d00ff;--yellow:#ffe600;--bg:#030308}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Roboto,sans-serif;color:#effcff}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,160vh);height:min(100vh,62.5vw);min-height:320px;background:#030308;overflow:hidden;box-shadow:0 0 50px rgba(0,243,255,0.2)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:clamp(10px,2vw,22px) clamp(14px,3vw,34px);pointer-events:none;text-shadow:0 0 10px var(--cyan)}
.brand{font-size:clamp(14px,2.2vw,24px);font-weight:900;letter-spacing:.25em;color:#fff;text-shadow:0 0 10px var(--cyan),0 0 20px var(--purple)}
.stats{display:flex;gap:clamp(12px,2.5vw,30px);font-size:clamp(11px,1.6vw,16px);font-weight:800;letter-spacing:.1em}
.stats div{background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:4px;border:1px solid rgba(0,243,255,0.3)}
.stats span{color:#aaa}
.stats b{color:var(--cyan);margin-left:5px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(15,3,25,0.85),rgba(2,1,10,0.95));text-align:center;padding:20px;z-index:10}
.panel{max-width:560px;padding:clamp(22px,4vw,42px);border:2px solid var(--cyan);border-radius:12px;background:rgba(10,5,20,0.9);box-shadow:0 0 35px var(--cyan),inset 0 0 25px var(--purple)}
h1{margin:0 0 8px;font-size:clamp(32px,6vw,60px);letter-spacing:.12em;line-height:1;color:#fff;text-shadow:0 0 8px #fff,0 0 20px var(--pink),0 0 40px var(--purple)}
#subtitle{color:var(--cyan);letter-spacing:.3em;font-size:11px;margin-bottom:22px;font-weight:bold}
p{color:#c4d9ed;line-height:1.6;font-size:14px}
button{border:0;border-radius:4px;padding:14px 36px;margin-top:15px;color:#000;background:linear-gradient(90deg,var(--cyan),var(--pink));font-weight:900;letter-spacing:.2em;cursor:pointer;box-shadow:0 0 25px var(--pink);transition:all 0.2s}
button:hover{filter:brightness(1.3);transform:scale(1.05)}
.sound{position:absolute;right:clamp(12px,2vw,24px);top:clamp(55px,7vw,75px);padding:6px 12px;margin:0;font-size:10px;letter-spacing:.1em;pointer-events:auto;background:rgba(0,0,0,0.7);color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 10px var(--cyan)}
.small{font-size:11px;color:#788fa6;margin-top:16px}
.hidden{display:none!important}
</style>
</head>

    <button id="start">INICIAR CAOS</button>

</div>
</div>
